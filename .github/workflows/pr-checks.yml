name: PR Checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify workflow lockfile
        run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
      - uses: pre-commit/action@v3.0.1
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: streetsidesoftware/cspell-action@v9.2.0
        with:
          files: 'questions/en/**/*.md'
          config: 'cspell.json'
          # Log progress and other information during the action execution.
          verbose: true
          # Determines if the action should be failed if any spelling issues are found.
          strict: true
          # Limit the files checked to the ones in the pull request or push.
          incremental_files_only: true
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
  translation-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Detect translation changes
        id: filter
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            questions/es/**
            questions/pt/**
            questions/pl/**
            questions/ja/**
            app/messages/es.json
            app/messages/pt.json
            app/messages/pl.json
            app/messages/ja.json
      - uses: actions/setup-node@v7.1.0
        if: steps.filter.outputs.any_changed == 'true'
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        if: steps.filter.outputs.any_changed == 'true'
        run: npm ci
        working-directory: app
      - name: Run translation tests
        if: steps.filter.outputs.any_changed == 'true'
        run: npm run test:translations
        working-directory: app
